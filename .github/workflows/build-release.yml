name: Build & Release PyClean Pro .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Verify Executable Exists
        run: |
          if (Test-Path "dist\PyCleanPro.exe") {
            Write-Host "✔ PyCleanPro.exe generated successfully!"
            Get-Item "dist\PyCleanPro.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "dist\PyCleanPro.exe not found!"
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCleanPro-Windows
          path: dist/PyCleanPro.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PyCleanPro.exe
          name: PyClean Pro ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
