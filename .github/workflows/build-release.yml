name: Build & Release PyClean Pro .exe & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Windows Binaries
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Build Windows Setup Installer
        run: |
          python build_installer.py

      - name: Verify Artifacts Exist
        run: |
          if ((Test-Path "dist\PyCleanPro.exe") -and (Test-Path "dist\PyCleanPro-Setup.exe")) {
            Write-Host "✔ Both PyCleanPro.exe and PyCleanPro-Setup.exe generated successfully!"
            Get-Item "dist\*" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "Required binaries not found in dist/!"
            exit 1
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PyCleanPro-Windows-Binaries
          path: |
            dist/PyCleanPro.exe
            dist/PyCleanPro-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyCleanPro.exe
            dist/PyCleanPro-Setup.exe
          name: PyClean Pro ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

