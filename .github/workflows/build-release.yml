name: Build & Release PyClean Pro .exe & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & Build Windows Binaries
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Sign Portable Executable (Optional - if CODE_SIGN_CERT_BASE64 secret is set)
        env:
          CERT_B64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            Write-Host "CODE_SIGN_CERT_BASE64 secret not configured; skipping Authenticode signing for PyCleanPro.exe."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found!"
            exit 1
          }
          & $signtool sign /f $certPath /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\PyCleanPro.exe"
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Build Windows Setup Installer
        run: |
          python build_installer.py

      - name: Sign Windows Setup Installer (Optional - if CODE_SIGN_CERT_BASE64 secret is set)
        env:
          CERT_B64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_B64)) {
            Write-Host "CODE_SIGN_CERT_BASE64 secret not configured; skipping Authenticode signing for PyCleanPro-Setup.exe."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $certPath /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\PyCleanPro-Setup.exe"
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Verify Artifacts & Generate SHA-256 Checksums
        run: |
          if ((Test-Path "dist\PyCleanPro.exe") -and (Test-Path "dist\PyCleanPro-Setup.exe")) {
            Write-Host "Both PyCleanPro.exe and PyCleanPro-Setup.exe generated successfully!"
            $hashExe = (Get-FileHash "dist\PyCleanPro.exe" -Algorithm SHA256).Hash.ToLower()
            $hashSetup = (Get-FileHash "dist\PyCleanPro-Setup.exe" -Algorithm SHA256).Hash.ToLower()
            @(
              "$hashExe  PyCleanPro.exe",
              "$hashSetup  PyCleanPro-Setup.exe"
            ) | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding utf8
            Get-Content "dist\SHA256SUMS.txt"
            Get-Item "dist\*" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "Required binaries not found in dist/!"
            exit 1
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PyCleanPro-Windows-Binaries
          path: |
            dist/PyCleanPro.exe
            dist/PyCleanPro-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PyCleanPro.exe
            dist/PyCleanPro-Setup.exe
            dist/SHA256SUMS.txt
          name: PyClean Pro ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

